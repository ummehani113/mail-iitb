<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mail IITB Assistant</title>
  <link rel="stylesheet" href="chat-window.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body data-layer="splash">

  <div class="cw-layer cw-splash" id="cw-splash">
    <div class="cw-splash-inner">
      <svg class="cw-mascot cw-mascot-lg" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="mring-l" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#67e8f9" />
            <stop offset="0.45" stop-color="#6366f1" />
            <stop offset="1" stop-color="#a855f7" />
          </linearGradient>
          <radialGradient id="mface-l" cx="0.35" cy="0.28" r="0.9">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#dce6f5" />
          </radialGradient>
          <radialGradient id="meye-l" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#e9fbff" />
            <stop offset="0.55" stop-color="#7dd3fc" />
            <stop offset="1" stop-color="#38bdf8" />
          </radialGradient>
          <filter id="mglow-l" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.2" />
          </filter>
        </defs>
        <circle cx="48" cy="48" r="44" fill="url(#mface-l)" stroke="url(#mring-l)" stroke-width="3.5" />
        <rect x="21" y="33" width="54" height="31" rx="15.5" fill="#0b1220" />
        <ellipse cx="37.5" cy="48.5" rx="6" ry="7" fill="url(#meye-l)" filter="url(#mglow-l)" opacity="0.9" />
        <ellipse cx="58.5" cy="48.5" rx="6" ry="7" fill="url(#meye-l)" filter="url(#mglow-l)" opacity="0.9" />
        <circle cx="37.5" cy="48.5" r="3.6" fill="#e9fbff" />
        <circle cx="58.5" cy="48.5" r="3.6" fill="#e9fbff" />
      </svg>

      <h1 class="cw-splash-title">Mail Assistant</h1>
      <p class="cw-splash-sub">Your last <strong>15 days</strong> of IIT Bombay mail,<br />one question away.</p>

      <button type="button" id="cw-get-started" class="cw-get-started">Get Started</button>
      <p class="cw-splash-foot">Works alongside webmail and the side panel.</p>
    </div>
  </div>

  <div class="cw-layer cw-chat" id="cw-chat">
    <header class="cw-header">
      <button type="button" id="cw-avatar-btn" class="cw-avatar-btn" title="Back to launcher">
        <svg class="cw-mascot cw-mascot-sm" viewBox="0 0 96 96" aria-hidden="true">
          <defs>
            <linearGradient id="mring-h" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#67e8f9" />
              <stop offset="0.45" stop-color="#6366f1" />
              <stop offset="1" stop-color="#a855f7" />
            </linearGradient>
            <radialGradient id="mface-h" cx="0.35" cy="0.28" r="0.9">
              <stop offset="0" stop-color="#ffffff" />
              <stop offset="1" stop-color="#dce6f5" />
            </radialGradient>
            <radialGradient id="meye-h" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#e9fbff" />
              <stop offset="0.55" stop-color="#7dd3fc" />
              <stop offset="1" stop-color="#38bdf8" />
            </radialGradient>
          </defs>
          <circle cx="48" cy="48" r="44" fill="url(#mface-h)" stroke="url(#mring-h)" stroke-width="4" />
          <rect x="21" y="33" width="54" height="31" rx="15.5" fill="#0b1220" />
          <circle cx="37.5" cy="48.5" r="6" fill="#7dd3fc" />
          <circle cx="58.5" cy="48.5" r="6" fill="#7dd3fc" />
          <circle cx="37.5" cy="48.5" r="3.4" fill="#e9fbff" />
          <circle cx="58.5" cy="48.5" r="3.4" fill="#e9fbff" />
        </svg>
      </button>

      <div class="cw-header-text">
        <div class="cw-header-title">Mail Assistant</div>
        <div id="cw-sync-status" class="cw-header-status">Not synced yet</div>
      </div>

      <div class="cw-header-actions">
        <button type="button" id="cw-sync-btn" class="cw-icon-btn" title="Sync 15 days">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button type="button" id="cw-minimize-btn" class="cw-icon-btn" title="Minimise (robot button brings it back)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button type="button" id="cw-close-btn" class="cw-icon-btn cw-icon-danger" title="Close chat window">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="6" y1="6" x2="18" y2="18"></line>
            <line x1="18" y1="6" x2="6" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <main id="chat-messages" class="chat-messages">
      <div class="chat-bubble chat-assistant chat-empty">
        Ask me anything about your last 15 days of mail — deadlines, who replied, unread work, or “summarise today”.
      </div>
    </main>

    <div id="chat-suggestions" class="chat-suggestions"></div>

    <div class="chat-input-row">
      <input type="text" id="chatInput" class="chat-input" placeholder="Ask about your mail…" autocomplete="off" />
      <button id="chatSendBtn" class="chat-send-btn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
    <div id="chat-status" class="cw-status"></div>
  </div>

  <script src="store.js"></script>
  <script src="context.js"></script>
  <script src="chat.js"></script>
  <script src="chat-window.js"></script>
</body>
</html>
